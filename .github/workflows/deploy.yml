name: Deploy to Hostinger VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync custom addons
        run: |
          rsync -az --delete \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '*.zip' \
            custom_addons/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/odoo/custom_addons/"

      - name: Sync compose without touching server .env
        run: |
          scp docker-compose.yml \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/docker/odoo-xdlf/docker-compose.yml"

      - name: Apply compose and restart Odoo
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'cd /docker/odoo-xdlf && docker compose up -d && docker restart odoo-xdlf-odoo-1'

      - name: Install or upgrade changed Odoo modules
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "Initial import or manual run — skip module upgrade."
            exit 0
          fi
          MODULES=$(git diff --name-only "$BEFORE" HEAD -- custom_addons \
            | awk -F/ 'NF>=2 {print $2}' \
            | sort -u \
            | grep -E '^[a-zA-Z0-9_]+$' \
            | paste -sd, - || true)
          if [ -z "$MODULES" ]; then
            echo "No custom module files changed."
            exit 0
          fi
          echo "Changed modules: $MODULES"
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s -- "$MODULES" << 'ENDSSH'
          set -euo pipefail
          MODULES="$1"
          cd /docker/odoo-xdlf
          trap 'docker compose up -d' EXIT
          docker compose stop odoo

          INIT=""
          UPDATE=""
          IFS=','
          for m in $MODULES; do
            m=$(echo "$m" | tr -d '[:space:]')
            [ -z "$m" ] && continue
            STATE=$(docker exec odoo-xdlf-db-1 psql -U odoo -d burqan -tAc \
              "SELECT state FROM ir_module_module WHERE name='${m}'" | tr -d '[:space:]' || true)
            if [ "$STATE" = "installed" ] || [ "$STATE" = "to upgrade" ]; then
              UPDATE="${UPDATE:+$UPDATE,}$m"
            else
              INIT="${INIT:+$INIT,}$m"
            fi
          done

          ARGS="-d burqan --stop-after-init --no-http --addons-path=/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons"
          [ -n "$INIT" ] && ARGS="$ARGS -i $INIT"
          [ -n "$UPDATE" ] && ARGS="$ARGS -u $UPDATE"
          echo "Installing: ${INIT:-none}"
          echo "Upgrading: ${UPDATE:-none}"

          docker compose run --rm --no-deps odoo odoo $ARGS
          docker compose up -d
          ENDSSH
